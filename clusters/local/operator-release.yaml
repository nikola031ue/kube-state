apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shop-operator
  namespace: flux-system
spec:
  interval: 1m
  chart:
    spec:
      chart: ./helm-charts/charts/shop-operator
      sourceRef:
        kind: GitRepository
        name: flux-system
  values:
    replicaCount: 1
    image:
      repository: shop-operator
      tag: latest