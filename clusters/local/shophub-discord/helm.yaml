apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shophub-discord
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/shophub
      sourceRef:
        kind: GitRepository
        name: shophub-charts
  interval: 1h
  values:
    discord:
      enabled: true
